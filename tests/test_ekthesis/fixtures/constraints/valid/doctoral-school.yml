notes: |-
  The application procedure requires a **project proposal** that describes the thesis. The format
  of the proposal is governed by Doctoral School ED 474, Frontières de l'Innovation en Recherche et
  Éducation (FIRE). The school is accredited by Université Paris Cité and co-accredited by PSL.

  The admission call prescribes five criteria in place of sections. Only three criteria bind the
  project itself, gathered in the group Admission criteria. The two remaining criteria bind the
  candidate:

  - **Education background**. A master's degree or an equivalent covering five years of higher
    education.
  - **Expertise**. A strong background in at least one discipline the project draws on.

  The [answers to the admission criteria](_decisions/admission-criteria.md) state the questions
  raised by each binding criterion, and how the proposal meets them.
