name: ekthesis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Data manipulation and formats
  - pyyaml                 # YAML file handling
  - types-pyyaml           # type stubs for PyYAML
  - jsonschema             # validation of records against JSON Schema draft 2020-12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Documentation
  - sphinx                 # documentation generator
  - myst-parser            # Markdown support for Sphinx
  - sphinx-rtd-theme       # ReadTheDocs theme
  - sphinx-needs           # for requirements and specifications in Sphinx
  - esbonio                # language server for Sphinx
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned by commit; pip installs a Git reference, which a conda dependency cannot
  # name.
  - pip
  - pip:
      - anagraphe-read @ git+https://github.com/esther-poniatowski/anagraphe.git@f4b9142b6cbc0f3bf1c831a05872854a7b6cf177#subdirectory=packages/read-python
variables:
