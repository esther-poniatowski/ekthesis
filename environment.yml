name: ekthesis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Data manipulation and formats
  - pyyaml                 # YAML file handling
  - types-pyyaml           # type stubs for PyYAML
  - jsonschema             # validation of records against JSON Schema draft 2020-12
  # Development tools
  - black                  # code formatting
  - mypy                   # static type checking
  - mypy_extensions
  - pylint                 # code linting
  - pyright                # static type analysis
  # Testing
  - pytest
  - pytest-mock
  - pytest-cov
  - pytest-pylint          # Pylint plugin for Pytest
  # Documentation
  - sphinx                 # documentation generator
  - myst-parser            # Markdown support for Sphinx
  - sphinx-rtd-theme       # ReadTheDocs theme
  - sphinx-needs           # for requirements and specifications in Sphinx
  - esbonio                # language server for Sphinx
  # CLI
  - typer                  # command line interface
  - rich                   # terminal output formatting
  # Sibling tools, pinned by commit; pip installs a Git reference, which a conda dependency cannot
  # name. The commit of Anagraphe equals the one that config/kleisis.yml pins.
  - pip
  - pip:
      - anagraphe-read @ git+https://github.com/esther-poniatowski/anagraphe.git@646b9d1cf995c06bd4b8a6bcaf910a8558f3671e#subdirectory=packages/read-python
      # The tests find the configuration of Kleisis in config/ through Hodegos, and read the
      # registry of a dependency through the reader of Kleisis. Kleisis stays at the commit that
      # anagraphe-read requires.
      - hodegos @ git+https://github.com/esther-poniatowski/hodegos.git@a151a28010058fda08a652aea345422037ff0d3c
      - kleisis @ git+https://github.com/esther-poniatowski/kleisis.git@b098f5e4bbabf7a872784fb6974471ad32205269
      # The tests check each findings log with the interface elenchos.profile, without the extra
      # validate.
      - elenchos @ git+https://github.com/esther-poniatowski/elenchos.git@33160b25e26226f50283a0503ba9c39796901ea2
variables:
