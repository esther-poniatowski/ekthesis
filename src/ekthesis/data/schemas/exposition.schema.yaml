# Argument record of one exposition, checked by `ekthesis check`.
# The keywords prefixed by `x-` other than `x-kind` and `x-identifier` at the root are read by
# ekthesis alone; the decision on the argument record states their meaning.
$schema: https://json-schema.org/draft/2020-12/schema
$id: exposition.schema.yaml
title: Exposition
description: >-
  An argument record states the ideas that an exposition presents, the rhetorical relations
  between them, and the parts that present them in order.
type: object
additionalProperties: false
required: [_schema, exposition, ideas, parts]
x-identifier: exposition.id
properties:
  _schema:
    const: 'ekthesis:exposition@3'
    title: Schema
    description: identifier of the contract that the record follows
    examples: ['ekthesis:exposition@3']
  exposition:
    $ref: '#/$defs/exposition'
    title: Exposition
    description: the identity of the exposition, and the records that fix its reader and its venue
  ideas:
    type: array
    x-kind: records
    minItems: 1
    items: {$ref: '#/$defs/idea'}
    title: Ideas
    description: every idea that the exposition presents, each referenced or authored
  relations:
    type: array
    x-kind: table
    items: {$ref: '#/$defs/relation'}
    title: Relations
    description: the rhetorical relations that the exposition asserts between its ideas
  parts:
    type: array
    x-kind: records
    minItems: 1
    items: {$ref: '#/$defs/part'}
    title: Parts
    description: the parts of the exposition, in reading order

$defs:
  identifier:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    x-kind: label
    description: an identifier in lower kebab-case

  record-identifier:
    type: string
    pattern: '^[a-z0-9]+([-_][a-z0-9]+)*$'
    x-kind: label
    description: an identifier in lower case, whose segments are joined by hyphens or underscores

  link:
    type: string
    pattern: '^\[[^\]]+\]\([^()\s]+\)$'
    x-kind: markdown-line
    description: a Markdown link, whose target holds no space

  exposition:
    type: object
    additionalProperties: false
    required: [id, title, source-bound]
    properties:
      id:
        $ref: '#/$defs/record-identifier'
        title: Identifier
        description: identifier of the exposition, unique among the records of a project
        examples: [mixture-input-encoding_poster_2026-11_pints]
      title:
        type: string
        minLength: 1
        x-kind: markdown-line
        title: Title
        description: title of the exposition, as its reader meets it
        examples: ['How do recurrent networks encode mixtures?']
      source-bound:
        type: boolean
        x-role: source-bound
        title: Bound to its sources
        description: >-
          whether the exposition presents the content of its sources, so that each idea about its
          subject, such as the objects of an inquiry or the behaviour of a program, must reference a
          unit of a source
        examples: [true]
      audience:
        $ref: '#/$defs/link'
        title: Audience
        description: link to the record of the audience for which the exposition is written
        examples: ['[Researchers studying biological networks](https://example.org/audiences/biological-networks-researchers.yml)']
      glossary:
        $ref: '#/$defs/link'
        title: Glossary
        description: link to the glossary that fixes the terms of the exposition
        examples: ['[Glossary of the project](../../glossary.yml)']
      venue-constraints:
        title: Venue constraints
        description: >-
          the constraints that the venue imposes on the exposition: the logical target of a
          constraints record, or a link to a note of constraints written before that contract
        oneOf:
          - title: Constraints record
            description: the logical target of a record of the contract `ekthesis:constraints`, naming no unit
            $ref: 'https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/target'
            x-target-contract: ['ekthesis:constraints']
            required: [id]
            not: {required: [unit]}
          - title: Link
            description: a link to a note of constraints, which a constraints record replaces
            $ref: '#/$defs/link'
        examples:
          - {id: constraints_submission_2026-11_pints}
          - '[Submission constraints](https://example.org/conferences/constraints_submission.md)'

  idea:
    type: object
    additionalProperties: false
    required: [id, statement, kind]
    x-identifier: id
    oneOf:
      - title: Referenced idea
        description: an idea stated by a record or a unit of a source, which the logical target designates
        required: [source]
      - title: Authored idea
        description: an idea written by the author, of one kind of the registry of authored kinds
        not: {required: [source]}
        properties:
          kind: {x-registry: authored-kinds}
    properties:
      id:
        $ref: '#/$defs/identifier'
        title: Identifier
        description: identifier of the idea, unique among the ideas of the record
        examples: [mixture-input]
      statement:
        type: string
        minLength: 1
        x-kind: markdown
        title: Statement
        description: the idea in one sentence, as the exposition presents it
        examples: ['A mixture input is a weighted sum of two component inputs.']
      source:
        $ref: 'https://github.com/esther-poniatowski/anagraphe/schemas/addressing.v1.schema.yml#/$defs/target'
        title: Source
        description: >-
          for a referenced idea, the logical target of the record or the unit that states the idea:
          a note by the id of its frontmatter, and a unit of a note by its block anchor
        examples: [{id: mixture-input, unit: definition}]
      kind:
        $ref: '#/$defs/identifier'
        title: Kind
        description: >-
          for an authored idea, its kind in the registry of authored kinds; for a referenced idea,
          the kind of its unit in the source, which no registry of ekthesis closes
        examples: [illustration, claim]

  relation:
    type: object
    additionalProperties: false
    required: [source, relation, target]
    properties:
      source:
        $ref: '#/$defs/identifier'
        x-refers: idea
        x-role: relation-source
        title: Source
        description: >-
          identifier of the satellite of a mononuclear relation, or of the first nucleus of a
          multinuclear relation
        examples: [plaid-illustration]
      relation:
        $ref: '#/$defs/identifier'
        x-registry: relations
        title: Relation
        description: the relation in the registry of rhetorical relations
        examples: [elaboration]
      target:
        $ref: '#/$defs/identifier'
        x-refers: idea
        x-role: relation-target
        title: Target
        description: >-
          identifier of the nucleus of a mononuclear relation, or of the second nucleus of a
          multinuclear relation
        examples: [mixture-input]

  part:
    type: object
    additionalProperties: false
    required: [id, title, ideas]
    x-identifier: id
    properties:
      id:
        $ref: '#/$defs/identifier'
        title: Identifier
        description: identifier of the part, unique among the parts of the record
        examples: [problem]
      title:
        type: string
        minLength: 1
        x-kind: markdown-line
        title: Title
        description: title of the part, as its reader meets it
        examples: [Problem]
      ideas:
        type: array
        x-kind: list
        minItems: 1
        items:
          $ref: '#/$defs/identifier'
          x-refers: idea
          description: identifier of an idea that the part presents
        title: Ideas
        description: the ideas that the part presents, in reading order
        examples: [[mixture-input, plaid-illustration]]
